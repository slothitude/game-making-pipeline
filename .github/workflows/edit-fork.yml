name: Edit Fork

# "Intelligent forking" — when the crew invokes an edit, dispatch this workflow.
# It forks the game repo to a branch, the brain chain writes COMPLETE FILES
# (not diffs — that was the failure mode), the godot gate wall judges, and the
# branch deploys (auto for T1/T2, confirm-button for T3 via Telegram).
#
#   gh workflow run edit-fork.yml -f game=octogram-arcade -f order_file=<ts>.json

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game repo to edit"
        required: true
        default: octogram-arcade
      order_file:
        description: "Feedback entry filename under runtime/feedback/"
        required: true

permissions:
  contents: write

jobs:
  fork-edit:
    name: Brain writes files -> gates judge -> branch deploys
    runs-on: ubuntu-latest
    container:
      image: docker://barichello/godot-ci:4.7.1
    env:
      GAME_SLUG: ${{ inputs.game }}
      ORDER_FILE: ${{ inputs.order_file }}
      NVAPI_KEY: ${{ secrets.NVAPI_KEY }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GAMES_TOKEN: ${{ secrets.GAMES_TOKEN }}
      GODOT_BIN: godot
    steps:
      - name: Install prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends git unzip ca-certificates fontconfig python3

      - name: Checkout GMP (feedback orders live here)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GAMES_TOKEN }}

      - name: Read the feedback order
        id: order
        run: |
          set -e
          ORDER="$(cat runtime/feedback/${ORDER_FILE})"
          echo "text=$(echo "$ORDER" | jq -r .text)" >> "$GITHUB_OUTPUT"
          echo "game=$(echo "$ORDER" | jq -r '.meta.game // .game // "octogram-arcade"')" >> "$GITHUB_OUTPUT"

      - name: Checkout game repo
        uses: actions/checkout@v4
        with:
          repository: slothitude/${{ steps.order.outputs.game }}
          ref: main
          token: ${{ secrets.GAMES_TOKEN }}
          path: game

      - name: Brain chain writes the fix (complete files, no diffs)
        run: |
          set -e
          cd game
          git checkout -q -b "edit/${ORDER_FILE%.json}"
          cd ..
          python3 - <<'PYEOF'
          import json, os, re, subprocess, urllib.request, time

          NVAPI = os.environ["NVAPI_KEY"]
          OPENROUTER = os.environ.get("OPENROUTER_KEY", "")
          GODOT = os.environ.get("GODOT_BIN", "godot")
          REPO = "game"

          def api(url, payload, key):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={
                  "Authorization": f"Bearer {key}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=400) as resp:
                  body = json.loads(resp.read().decode())
              content = body["choices"][0]["message"].get("content") or ""
              if not content.strip():
                  raise RuntimeError("empty")
              return content

          def brain(messages, max_tokens=8192):
              for model in ("z-ai/glm-5.3", "moonshotai/kimi-k3"):
                  for _ in range(2):
                      try:
                          return api("https://integrate.api.nvidia.com/v1/chat/completions",
                                   {"model": model, "messages": messages,
                                    "temperature": 0.3, "max_tokens": max_tokens}, NVAPI)
                      except Exception as e:
                          print(f"brain {model}: {e}", flush=True)
                          time.sleep(10)
              return api("https://openrouter.ai/api/v1/chat/completions",
                        {"model": "openrouter/free", "messages": messages,
                         "temperature": 0.3, "max_tokens": max_tokens}, OPENROUTER)

          def write_files(repo, output):
              pattern = re.compile(
                  r"```(?:[a-zA-Z0-9_./-]+:)?\s*([a-zA-Z0-9_./-]+\.(?:gd|tscn|godot|cfg|txt|json))\s*\n(.*?)```",
                  re.DOTALL)
              made = []
              for m in pattern.finditer(output):
                  rel, code = m.group(1), m.group(2)
                  dest = os.path.join(repo, rel)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  open(dest, "w", encoding="utf-8", newline="\n").write(code)
                  made.append(rel)
              return made

          def gates(repo):
              fails = []
              subprocess.run([GODOT, "--headless", "--path", repo, "--import"],
                             capture_output=True, timeout=600)
              tdir = os.path.join(repo, "tests")
              suites = sorted(f[:-3] for f in os.listdir(tdir) if f.endswith(".gd")) if os.path.isdir(tdir) else []
              for suite in suites:
                  for run_i in range(2):
                      r = subprocess.run(
                          [GODOT, "--headless", "--path", repo, "--script", f"res://tests/{suite}.gd"],
                          capture_output=True, text=True, timeout=900)
                      out = r.stdout + r.stderr
                      if r.returncode != 0 or re.search(r"[1-9]\d* failed", out):
                          fails.append(f"{suite} run{run_i+1}: " + "\n".join(out.splitlines()[-8:]))
              return fails

          with open(os.path.join("runtime", "feedback",
                                 os.environ["ORDER_FILE"])) as f:
              order = json.load(f)
          text = order["text"]

          system = (
              "You are the Game Making Pipeline's game fixer. You write COMPLETE Godot 4.7 "
              "GDScript files. Output ONLY the files that change as fenced blocks "
              "```path:scripts/foo.gd — every file COMPLETE (the full file, not a diff), "
              "tabs, no placeholders. Laws: constants in feel.gd, tests are SceneTree "
              "scripts with PASS/FAIL and 'Ran N checks: X passed, 0 failed' summaries.")
          context = f"Player feedback to fix: {text}\n\nThe repo is a Godot 4.7 GDScript game."

          messages = [{"role": "system", "content": system}, {"role": "user", "content": context}]
          for attempt in range(3):
              out = brain(messages)
              made = write_files(REPO, out)
              if not made:
                  messages.append({"role": "user", "content": "No files parsed. Use ```path:file.gd format."})
                  continue
              fails = gates(REPO)
              if not fails:
                  print(f"GREEN on attempt {attempt+1}: {made}", flush=True)
                  subprocess.run(["git", "-C", REPO, "add", "-A"])
                  subprocess.run(["git", "-C", REPO, "-c", "user.name=gmp-crew",
                                  "-c", "user.email=actions@noreply.github.com",
                                  "commit", "-q", "-m", f"crew fix (attempt {attempt+1}): {text[:80]}"])
                  break
              messages += [{"role": "assistant", "content": out[-2000:]},
                           {"role": "user", "content": "Gates failed:\n" + "\n".join(fails)[:2000] +
                            "\nWrite the FULL corrected files."}]
          else:
              raise SystemExit("NOT_GREEN")
          PYEOF

      - name: Deploy (green = ship it)
        run: |
          set -e
          cd game
          git push -q -f origin "edit/${ORDER_FILE%.json}:deploy" || {
            git push -q origin "edit/${ORDER_FILE%.json}"
            echo "pushed as branch"
          }
          echo "deploy branch pushed"

      - name: Notify Telegram
        run: |
          TEXT="${{ steps.order.outputs.text }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="✅ Crew fix shipped (edit-fork): ${TEXT:0:120} — live in ~1 min" || true

      - name: Mark order done
        run: |
          jq '.status = "done"' "runtime/feedback/${ORDER_FILE}" > tmp && mv tmp "runtime/feedback/${ORDER_FILE}"
          git config user.name gmp-crew
          git config user.email actions@noreply.github.com
          git add runtime/
          git commit -q -m "crew: ${ORDER_FILE} done" || true
          git push -q || true

      - name: On failure — notify
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🛑 edit-fork failed for ${ORDER_FILE} — human review needed" || true
