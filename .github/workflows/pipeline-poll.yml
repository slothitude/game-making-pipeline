name: Pipeline poll

# The cloud loop, one pass at a time: pull pending feedback, run it through the
# editor (glm triage -> diff -> gate wall -> deploy -> Telegram reply), then exit.
# `--once` processes pending feedback and exits; the Rog loop runs the SAME script
# with no flag and keeps polling. This job assumes cloud_editor v2 conventions
# (env-var config: TG_TOKEN / NVAPI_KEY / CHAT_ID, CLOUD=1 for cloud mode).
# GitHub schedules run on UTC and can be delayed by minutes at busy times.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    name: Process pending feedback (one pass)
    runs-on: ubuntu-latest
    env:
      CLOUD: "1"
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      NVAPI_KEY: ${{ secrets.NVAPI_KEY }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Checkout GMP
        uses: actions/checkout@v4

     
      - name: Process pending feedback, then exit
        run: python3 cloud_editor/cloud_editor.py --once
      - name: Commit runtime state (git is the database)
        run: |
          git config user.name gmp-runtime
          git config user.email actions@users.noreply.github.com
          git add runtime/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "runtime state update"
          git push

      - name: New-game order detection (finish the loop)
        env:
          GAMES_TOKEN: ${{ secrets.GAMES_TOKEN }}
        run: |
          for f in runtime/orders/*.json; do
            [ -f "$f" ] || continue
            STATUS=$(jq -r .status "$f" 2>/dev/null || echo missing)
            if [ "$STATUS" = "pending" ]; then
              NAME=$(basename "$f")
              echo "Dispatching new-game.yml for $NAME"
              curl -s -X POST -H "Authorization: Bearer ${GAMES_TOKEN}" \n                -H "Accept: application/vnd.github+json" \n                https://api.github.com/repos/slothitude/game-making-pipeline/actions/workflows/new-game.yml/dispatches \n                -d "{\"ref\":\"main\",\"inputs\":{\"order_file\":\"$NAME\"}}"
            fi
          done

      - name: Intelligent forking — dispatch edit-fork for pending fixes
        env:
          GAMES_TOKEN: ${{ secrets.GAMES_TOKEN }}
        run: |
          for f in runtime/feedback/*.json; do
            [ -f "$f" ] || continue
            STATUS=$(jq -r '.status // "pending"' "$f" 2>/dev/null || echo pending)
            GAME=$(jq -r '.meta.game // .game // "octogram-arcade"' "$f" 2>/dev/null)
            if [ "$STATUS" = "pending" ]; then
              NAME=$(basename "$f")
              echo "Dispatching edit-fork for $GAME / $NAME"
              curl -s -X POST -H "Authorization: Bearer ${GAMES_TOKEN}" \n                -H "Accept: application/vnd.github+json" \n                https://api.github.com/repos/slothitude/game-making-pipeline/actions/workflows/edit-fork.yml/dispatches \n                -d "{\"ref\":\"main\",\"inputs\":{\"game\":\"$GAME\",\"order_file\":\"$NAME\"}}"
            fi
          done
