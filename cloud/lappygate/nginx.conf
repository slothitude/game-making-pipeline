# lappy-gate nginx — Telegram-verified front for the public services.
# One server block per service; auth_request hits the gate; widget/login
# paths pass through so the Telegram flow works on any port.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# auth check: 401 from the gate -> bounce to the login page
upstream gate { server 127.0.0.1:9010; }

server {
  listen 9200;                          # -> EmulatorJS
  location /__ { proxy_pass http://gate; proxy_set_header Host $host; }
  error_page 401 = @login;
  location @login { return 302 /__login?back=$scheme://$host$request_uri; }
  location / {
    auth_request /__verify;
    proxy_pass http://127.0.0.1:8200;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /__verify { internal; proxy_pass http://gate/__verify; }
}

server {
  listen 9201;                          # -> OpenWebUI
  location /__ { proxy_pass http://gate; proxy_set_header Host $host; }
  error_page 401 = @login;
  location @login { return 302 /__login?back=$scheme://$host$request_uri; }
  location / {
    auth_request /__verify;
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /__verify { internal; proxy_pass http://gate/__verify; }
}

server {
  listen 9202;                          # -> Portainer
  location /__ { proxy_pass http://gate; proxy_set_header Host $host; }
  error_page 401 = @login;
  location @login { return 302 /__login?back=$scheme://$host$request_uri; }
  location / {
    auth_request /__verify;
    proxy_pass https://127.0.0.1:9443;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /__verify { internal; proxy_pass http://gate/__verify; }
}

server {
  listen 9203;                          # -> Jellyfin
  location /__ { proxy_pass http://gate; proxy_set_header Host $host; }
  error_page 401 = @login;
  location @login { return 302 /__login?back=$scheme://$host$request_uri; }
  location / {
    auth_request /__verify;
    proxy_pass http://127.0.0.1:8097;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
  }
  location = /__verify { internal; proxy_pass http://gate/__verify; }
}
