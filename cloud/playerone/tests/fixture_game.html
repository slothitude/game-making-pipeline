<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FIXTURE — selfplay target</title>
<style>
  html, body { margin: 0; background: #101018; }
  #status { position: fixed; inset: 0; background: #101018; color: #cfd6ff;
            font: 24px monospace; display: flex; align-items: center;
            justify-content: center; }
</style>
</head>
<body>
<canvas id="game" width="480" height="800"></canvas>
<div id="status">loading fixture...</div>
<script>
// Minimal animated one-canvas game standing in for a retromonkey title in
// local selfplay verification: the same loader-overlay contract (#status
// hides once live), drag steering, a centre tap, Enter/Escape keys, and a
// state probe at window.fixtureState() for the fixture playthrough module.
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const game = { state: 'title', score: 0, pulses: [] };
const ship = { x: 240, y: 430 };
let bugs = [];

function spawnBugs() {
  bugs = [0, 1, 2].map(i => ({ x: 80 + 140 * i, y: 200 + 90 * i,
                               dx: 1.3 + 0.4 * i, dy: -1.1 + 0.5 * i }));
}
spawnBugs();

// -- input ----------------------------------------------------------------
let dragging = null;
function pagePoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', e => {
  if (game.state === 'title') { startGame(); return; }
  dragging = pagePoint(e);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const point = pagePoint(e);
  ship.x = Math.max(20, Math.min(460, ship.x + (point.x - dragging.x) * 0.8));
  ship.y = Math.max(60, Math.min(760, ship.y + (point.y - dragging.y) * 0.8));
  dragging = point;
});
canvas.addEventListener('pointerup', () => { dragging = null; });
canvas.addEventListener('click', e => {
  if (game.state !== 'playing') return;
  const point = pagePoint(e);
  if (Math.abs(point.x - 240) < 60 && Math.abs(point.y - 430) < 60) {
    game.score += 1;
    game.pulses.push({ x: 240, y: 430, r: 6 });
  }
});
window.addEventListener('keydown', e => {
  if (game.state !== 'playing') return;
  if (e.key === 'Enter') game.score += 1;
  if (e.key === 'Escape') spawnBugs();
});
function startGame() { game.state = 'playing'; game.score = 0; spawnBugs(); }

// -- probe ----------------------------------------------------------------
function nearestBearing() {
  let best = 'none', bestD = Infinity;
  for (const bug of bugs) {
    const dx = bug.x - ship.x, dy = bug.y - ship.y;
    const d = dx * dx + dy * dy;
    if (d >= bestD) continue;
    bestD = d;
    best = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'E' : 'W')
                                       : (dy > 0 ? 'S' : 'N');
  }
  return best;
}
window.fixtureState = () => ({
  state: game.state,
  score: game.score,
  ship: { x: Math.round(ship.x), y: Math.round(ship.y) },
  lane: ship.x < 160 ? 'left' : ship.x > 320 ? 'right' : 'mid',
  bugs: bugs.length,
  bearing: nearestBearing(),
});

// -- frame ----------------------------------------------------------------
function frame(t) {
  ship.x = 20 + ((ship.x - 20 + 0.31) % 440);   // slow autonomous drift
  for (const bug of bugs) {
    bug.x += bug.dx; bug.y += bug.dy;
    if (bug.x < 12 || bug.x > 468) bug.dx *= -1;
    if (bug.y < 80 || bug.y > 720) bug.dy *= -1;
  }
  ctx.fillStyle = '#101018';
  ctx.fillRect(0, 0, 480, 800);
  ctx.fillStyle = '#39d98a';
  for (const bug of bugs) {
    ctx.beginPath(); ctx.arc(bug.x, bug.y, 4, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#ffd75e';
  ctx.beginPath(); ctx.moveTo(ship.x, ship.y - 12);
  ctx.lineTo(ship.x - 9, ship.y + 10);
  ctx.lineTo(ship.x + 9, ship.y + 10);
  ctx.closePath(); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cfd6ff';
  ctx.font = '20px monospace';
  ctx.fillText('score ' + game.score, 240, 40);
  ctx.fillText(String(t), 440, 790);
  if (game.state === 'title') {
    ctx.fillStyle = '#f4f1e8';
    ctx.font = '44px monospace';
    ctx.fillText('FIXTURE', 240, 380);
    ctx.font = '16px monospace';
    ctx.fillText('tap to start', 240, 430);
  }
  game.pulses = game.pulses.filter(p => (p.r += 3) < 90);
  for (const p of game.pulses) {
    ctx.strokeStyle = 'rgba(255, 215, 94, 0.6)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => {
  document.getElementById('status').style.visibility = 'hidden';
}, 800);
</script>
</body>
</html>
